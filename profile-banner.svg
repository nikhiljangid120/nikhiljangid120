<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#070B14"/>
    <stop offset="0.55" stop-color="#0B1220"/>
    <stop offset="1" stop-color="#111827"/>
  </linearGradient>
  <linearGradient id="line" x1="70" y1="245" x2="1130" y2="245" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38BDF8"/>
    <stop offset="0.5" stop-color="#818CF8"/>
    <stop offset="1" stop-color="#34D399"/>
  </linearGradient>
  <radialGradient id="glowBlue">
    <stop stop-color="#38BDF8" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowViolet">
    <stop stop-color="#818CF8" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.032"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
</defs>

<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
<rect width="1200" height="300" rx="22" fill="url(#grid)"/>

<circle cx="1060" cy="48" r="190" fill="url(#glowBlue)" filter="url(#blur)">
  <animate attributeName="cx" values="1060;1015;1060" dur="14s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="48;68;48" dur="14s" repeatCount="indefinite"/>
</circle>
<circle cx="930" cy="255" r="180" fill="url(#glowViolet)" filter="url(#blur)">
  <animate attributeName="cx" values="930;980;930" dur="18s" repeatCount="indefinite"/>
</circle>

<g opacity="0.94">
  <rect x="48" y="42" width="475" height="216" rx="18" fill="#020617" fill-opacity="0.76" stroke="#334155" stroke-opacity="0.7"/>
  <circle cx="76" cy="68" r="4.5" fill="#F87171"/>
  <circle cx="92" cy="68" r="4.5" fill="#FBBF24"/>
  <circle cx="108" cy="68" r="4.5" fill="#34D399"/>

  <text x="76" y="102" fill="#64748B" font-family="monospace" font-size="13">~/nikhil/profile</text>
  <text x="76" y="135" fill="#E2E8F0" font-family="monospace" font-size="18">$ focus --now</text>
  <text x="76" y="164" fill="#38BDF8" font-family="monospace" font-size="15">software-engineering</text>
  <text x="76" y="188" fill="#A5B4FC" font-family="monospace" font-size="14">backend · AI systems · developer tools</text>
  <text x="76" y="211" fill="#94A3B8" font-family="monospace" font-size="14">C++ DSA · TypeScript · systems</text>
  <text x="76" y="239" fill="#34D399" font-family="monospace" font-size="14">$ build → measure → improve</text>
  <rect x="301" y="227" width="8" height="16" rx="2" fill="#34D399">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="570" y="93" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40">Nikhil Jangid</text>
<text x="572" y="126" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="19">Software Engineer · Backend · AI Engineering</text>
<text x="572" y="158" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">Building practical products and reliable systems,</text>
<text x="572" y="181" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">with a focus on useful AI applications.</text>

<g>
  <circle cx="580" cy="224" r="5" fill="#34D399">
    <animate attributeName="r" values="4.5;5.5;4.5" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="594" y="229" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="14">2026 B.Tech CSE · Jaipur, India</text>
</g>

<path d="M0 251 C150 231 285 266 430 246 S710 226 860 248 S1060 267 1200 244" stroke="url(#line)" stroke-opacity="0.16" stroke-width="1.6"/>
<path d="M0 258 C150 238 285 273 430 253 S710 233 860 255 S1060 274 1200 251" stroke="url(#line)" stroke-opacity="0.075" stroke-width="1" stroke-dasharray="5 12">
  <animate attributeName="stroke-dashoffset" from="0" to="-170" dur="18s" repeatCount="indefinite"/>
</path>

<path d="M570 250H1110" stroke="#334155" stroke-opacity="0.45"/>
<circle cx="570" cy="250" r="2.5" fill="#38BDF8">
  <animate attributeName="cx" values="570;1110;570" dur="12s" repeatCount="indefinite"/>
</circle>
</svg>
