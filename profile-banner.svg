<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#060B16"/>
    <stop offset="0.55" stop-color="#0B1220"/>
    <stop offset="1" stop-color="#101827"/>
  </linearGradient>
  <linearGradient id="accent" x1="90" y1="250" x2="1100" y2="45" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38BDF8"/>
    <stop offset="0.5" stop-color="#818CF8"/>
    <stop offset="1" stop-color="#34D399"/>
  </linearGradient>
  <radialGradient id="glowBlue">
    <stop stop-color="#38BDF8" stop-opacity="0.17"/>
    <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowGreen">
    <stop stop-color="#34D399" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" stroke="#94A3B8" stroke-opacity="0.035"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4"/></filter>
</defs>

<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
<rect width="1200" height="300" rx="22" fill="url(#grid)"/>

<circle cx="1050" cy="45" r="190" fill="url(#glowBlue)" filter="url(#blur)">
  <animate attributeName="cx" values="1050;1015;1050" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="45;65;45" dur="9s" repeatCount="indefinite"/>
</circle>
<circle cx="1140" cy="265" r="170" fill="url(#glowGreen)" filter="url(#blur)">
  <animate attributeName="cx" values="1140;1110;1140" dur="11s" repeatCount="indefinite"/>
</circle>

<path d="M0 255C170 215 300 280 465 225C635 168 790 245 930 155C1040 84 1120 105 1200 58" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="1.8"/>
<path d="M0 274C180 232 315 292 485 244C660 195 805 267 950 180C1050 120 1130 135 1200 92" stroke="#E2E8F0" stroke-opacity="0.055"/>

<g opacity="0.9">
  <rect x="48" y="42" width="475" height="216" rx="18" fill="#020617" fill-opacity="0.78" stroke="#334155" stroke-opacity="0.75"/>
  <circle cx="76" cy="68" r="4.5" fill="#F87171"/>
  <circle cx="92" cy="68" r="4.5" fill="#FBBF24"/>
  <circle cx="108" cy="68" r="4.5" fill="#34D399"/>

  <text x="76" y="102" fill="#64748B" font-family="monospace" font-size="13">~/nikhil/profile</text>
  <text x="76" y="135" fill="#E2E8F0" font-family="monospace" font-size="18">$ focus --now</text>
  <text x="76" y="164" fill="#38BDF8" font-family="monospace" font-size="15">software-engineering</text>
  <text x="76" y="188" fill="#A5B4FC" font-family="monospace" font-size="14">full-stack · backend · AI engineering</text>
  <text x="76" y="211" fill="#94A3B8" font-family="monospace" font-size="14">C++ DSA · systems · developer tooling</text>
  <text x="76" y="239" fill="#34D399" font-family="monospace" font-size="14">$ build → learn → ship → improve</text>
  <rect x="301" y="227" width="8" height="16" rx="2" fill="#34D399">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>

<text x="570" y="93" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40">Nikhil Jangid</text>
<text x="572" y="126" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="19">Software Engineer · Full-Stack · AI Engineering</text>
<text x="572" y="158" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">Building practical products, reliable backends,</text>
<text x="572" y="181" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="15">and AI-powered developer experiences.</text>

<g>
  <circle cx="580" cy="224" r="5" fill="#34D399">
    <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/>
